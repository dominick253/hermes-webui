<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#1e1e1e" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<title>Hermes</title>
<style>
  /* ============================================================
     HERMES — cyberpunk terminal design system
     near-black base · electric-cyan glow · amber/purple accents
     variable Inter (chrome) + JetBrains Mono (content/code)
     ============================================================ */
  @font-face{
    font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('/fonts/inter-var.woff2') format('woff2');}
  @font-face{
    font-family:'JetBrains Mono';font-style:normal;font-weight:100 800;font-display:swap;
    src:url('/fonts/jbm-var.woff2') format('woff2');}

  :root{
    /* surfaces — near-black, blue-shifted, layered by shade (borderless feel) */
    --bg:#070708; --chat:#070708;
    --panel:#0c0c10; --panel2:#121218; --panel3:#1a1a23;
    --code:#0b0b0f;
    /* hairlines — barely-there; glow does the delineating */
    --line:#1f1f28; --line2:#2f2f3b;
    /* text */
    --fg:#e6e6ec; --bright:#ffffff; --muted:#9c9cac; --faint:#68687a;
    /* electric cyan primary */
    --accent:#35e0ff; --accent-hi:#86f0ff;
    --accent-ink:#03141c; --accent-dim:rgba(53,224,255,.13); --accent-glow:0 0 12px rgba(53,224,255,.5);
    /* semantic accents */
    --purple:#c792ea; --purple-glow:0 0 10px rgba(199,146,234,.45);
    --green:#3fe08a; --green-glow:0 0 9px rgba(63,224,138,.5);
    --blue:#61b0ff; --orange:#ffab5e; --red:#ff6b6b;
    /* type */
    --mono:'JetBrains Mono',ui-monospace,'Fira Code','Cascadia Code',Menlo,Consolas,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --radius:10px;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 var(--sans);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overscroll-behavior:none;}
  #root{height:100%}
  a{color:var(--blue)}
  ::selection{background:var(--accent-dim);color:var(--accent-hi)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* thin cyan-tinted scrollbars */
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#262631;border-radius:6px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent);background-clip:content-box}

  button{font-family:inherit}
  input,textarea,select{font-family:inherit}

  .app{height:100%;display:flex;background:var(--bg);
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

  /* ============ SIDEBAR ============ */
  .side{width:292px;flex:none;display:flex;flex-direction:column;
    background:var(--panel);border-right:1px solid var(--line)}
  .side-head{display:flex;align-items:center;gap:10px;padding:16px 14px 12px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16.5px;letter-spacing:.2px;color:var(--bright)}
  .logo .mark{width:27px;height:27px;border-radius:8px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-hi));
    display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-size:14px;font-weight:800;
    box-shadow:var(--accent-glow)}
  .newchat{margin-left:auto;display:flex;align-items:center;gap:7px;
    background:linear-gradient(135deg,var(--accent),var(--accent-hi));
    border:none;color:var(--accent-ink);font-weight:700;font-size:13.5px;
    padding:8px 14px;border-radius:8px;cursor:pointer;
    box-shadow:var(--accent-glow);transition:transform .12s,box-shadow .15s,filter .15s}
  .newchat:hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 0 18px rgba(53,224,255,.7)}
  .newchat:active{transform:translateY(0)}
  .newchat svg{width:14px;height:14px}
  .searchwrap{padding:0 14px 12px;position:relative}
  .searchwrap svg{position:absolute;left:24px;top:10px;width:14px;height:14px;color:var(--faint);transition:color .15s}
  .searchwrap:focus-within svg{color:var(--accent)}
  .search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:9px 12px 9px 32px;color:var(--fg);font-size:13.5px;outline:none;transition:border-color .15s,box-shadow .15s}
  .search::placeholder{color:var(--faint)}
  .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
  .side-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 8px 12px}
  .grp{color:var(--faint);font-size:10.5px;font-weight:800;letter-spacing:1px;
    text-transform:uppercase;padding:14px 10px 6px;font-family:var(--mono)}
  .item{display:flex;gap:10px;padding:10px;border-radius:9px;cursor:pointer;
    position:relative;transition:background .13s,transform .13s}
  .item:hover{background:var(--panel2);transform:translateX(2px)}
  .item.on{background:var(--panel3)}
  .item.on::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;
    border-radius:3px;background:var(--accent);box-shadow:var(--accent-glow)}
  .item .body{flex:1;min-width:0}
  .item .trow{display:flex;align-items:baseline;gap:8px}
  .item .name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;flex:1;color:var(--fg)}
  .item.on .name{color:var(--bright)}
  .item .ago{color:var(--faint);font-size:11px;flex:none;font-family:var(--mono)}
  .item .prev{color:var(--muted);font-size:12px;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .meta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:5px;
    padding:1px 7px;font-weight:600;white-space:nowrap;font-family:var(--mono);font-size:10px;color:var(--muted)}
  .item .del{position:absolute;right:8px;bottom:8px;background:transparent;border:none;
    color:var(--faint);cursor:pointer;padding:4px;border-radius:6px;display:none;transition:color .13s,background .13s}
  .item:hover .del{display:block}
  .item .del:hover{color:var(--red);background:rgba(255,107,107,.1)}
  .item .del:hover::after{content:"Delete";position:absolute;right:28px;top:50%;transform:translateY(-50%);
    background:var(--panel3);border:1px solid var(--line2);color:var(--fg);
    font-size:10.5px;font-weight:600;letter-spacing:.3px;padding:2px 8px;border-radius:5px;white-space:nowrap;
    font-family:var(--sans)}
  .side-foot{border-top:1px solid var(--line);padding:12px 14px;
    display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;background:var(--panel)}
  .side-foot .pulse{width:9px;height:9px;border-radius:50%;background:var(--green);
    box-shadow:var(--green-glow);flex:none;animation:pp 2s ease-in-out infinite}
  .side-foot .m{font-weight:700;color:var(--bright);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-family:var(--mono);font-size:11.5px}
  .side-foot .p{color:var(--faint);white-space:nowrap;font-size:11px}
  .backdrop{display:none}

  /* ============ MAIN ============ */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chat);position:relative}
  .jump{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:5;
    display:flex;align-items:center;gap:6px;padding:7px 13px 7px 11px;cursor:pointer;
    background:var(--panel2);border:1px solid var(--accent-dim);border-radius:999px;
    color:var(--accent-hi);font:600 12px/1 var(--mono);letter-spacing:.2px;
    box-shadow:0 6px 20px rgba(0,0,0,.5),var(--accent-glow);backdrop-filter:blur(8px);
    animation:jumpin .18s ease-out}
  .jump:active{transform:translateX(-50%) scale(.97)}
  @keyframes jumpin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  .bar{display:flex;align-items:center;gap:10px;padding:12px 16px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  .bar .title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;flex:1;min-width:0;color:var(--bright)}
  .modelpill{display:flex;align-items:center;gap:8px;background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;
    color:var(--fg);font-size:13px;font-weight:600;flex:none;font-family:var(--mono);
    transition:border-color .15s,box-shadow .15s,background .15s}
  .modelpill:hover{border-color:var(--line2);background:var(--panel3)}
  .modelpill.locked{border-color:var(--accent);color:var(--bright);box-shadow:0 0 0 1px var(--accent-dim)}
  .modelpill .mdot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;box-shadow:var(--green-glow)}
  .modelpill .mp{color:var(--faint);font-weight:500;font-size:11.5px}
  .modelpill svg{width:13px;height:13px;color:var(--faint)}
  .btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:8px 12px;font-size:13.5px;cursor:pointer;
    transition:background .15s,border-color .15s,transform .12s;flex:none}
  .btn:hover{border-color:var(--line2);background:var(--panel3)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent}
  .btn.icon{padding:8px;display:flex;align-items:center;justify-content:center}
  .btn.icon svg{width:17px;height:17px}
  .iconbtn{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:7px;
    border-radius:8px;display:none;align-items:center;justify-content:center;flex:none;transition:color .13s,background .13s}
  .iconbtn:hover{color:var(--bright);background:var(--panel2)}
  .iconbtn svg{width:19px;height:19px}

  /* chat */
  .chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:24px 18px 14px;scroll-behavior:auto;
    background:radial-gradient(1200px 400px at 50% -10%,rgba(53,224,255,.05),transparent 60%),var(--chat)}
  .chat-inner{max-width:860px;margin:0 auto}
  .msg{display:flex;margin:0 0 20px}
  .msg.user{flex-direction:column;align-items:flex-end}
  .msg.assistant{display:block}
  .bubble{max-width:84%;padding:12px 15px 16px;border-radius:var(--radius);
    font:14px/1.72 var(--sans);
    white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;color:var(--fg)}
  .bubble b{color:var(--bright);font-weight:700}
  .msg.user .bubble{background:var(--panel2);border:1px solid var(--line);
    border-bottom-right-radius:4px;color:var(--bright);
    box-shadow:inset 0 0 0 1px rgba(53,224,255,.08)}
  .ahead{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .ahead .who{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;color:var(--bright);letter-spacing:.2px}
  .ahead .who .mark{width:20px;height:20px;border-radius:6px;
    background:linear-gradient(135deg,var(--accent),var(--accent-hi));display:flex;
    align-items:center;justify-content:center;color:var(--accent-ink);font-size:11px;font-weight:800;flex:none;
    box-shadow:var(--accent-glow)}
  .copyb{background:transparent;border:none;color:var(--faint);cursor:pointer;
    padding:3px 6px;border-radius:5px;font-size:11.5px;display:flex;align-items:center;gap:5px;
    transition:color .13s,background .13s}
  .copyb:hover{color:var(--fg);background:var(--panel2)}
  .copyb svg{width:12px;height:12px}
  .mcol{max-width:84%;display:flex;flex-direction:column;align-items:flex-end}
  .mcol .bubble{max-width:100%}
  .acts{display:flex;gap:2px;margin-top:6px}
  .speakb{background:transparent;border:none;color:var(--faint);cursor:pointer;
    padding:5px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:color .13s,background .13s}
  .speakb:hover{color:var(--bright);background:var(--panel2)}
  .speakb svg{width:15px;height:15px}
  .speakb.on{color:var(--accent);background:var(--accent-dim)}
  .speakb.on svg{animation:tp 1s infinite}
  .msg.assistant .bubble{background:#111216;border:1px solid var(--line);
    border-bottom-left-radius:4px;max-width:100%}

  /* reasoning — purple accent, auto-open while streaming */
  .reasoning{background:var(--code);border:1px solid var(--line);border-left:3px solid var(--purple);
    border-radius:var(--radius);
    margin-bottom:10px;overflow:hidden}
  .reasoning .rh{display:flex;align-items:center;gap:8px;padding:9px 13px;cursor:pointer;
    color:var(--purple);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;
    user-select:none;font-family:var(--mono);text-shadow:var(--purple-glow)}
  .reasoning .rh .car{margin-left:auto;color:var(--faint);transition:transform .15s;display:flex}
  .reasoning[open] .rh .car{transform:rotate(90deg)}
  .reasoning .rb{padding:2px 15px 13px;font:12.5px/1.72 var(--mono);color:var(--muted);
    white-space:pre-wrap;max-height:360px;overflow-y:auto}
  .reasoning summary::-webkit-details-marker{display:none}

  .tool{display:flex;align-items:center;gap:8px;background:var(--code);
    border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;margin-bottom:10px;
    font:12.5px/1.5 var(--mono);color:var(--muted)}
  .tool .tn{color:var(--blue);font-weight:600}
  .tool .spin{width:12px;height:12px;border:2px solid #2a2a34;border-top-color:var(--blue);
    border-radius:50%;animation:sp .8s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* code blocks — cyberpunk syntax palette + language header + copy */
  .codeblk{background:var(--code);border:1px solid var(--line);border-radius:var(--radius);
    margin:12px 0;overflow:hidden;font-family:var(--mono)}
  .codeblk .cbh{display:flex;align-items:center;justify-content:space-between;
    padding:6px 12px;border-bottom:1px solid var(--line);background:var(--panel);
    color:var(--faint);font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;font-family:var(--mono)}
  .codeblk .cbcopy{background:transparent;border:none;color:var(--faint);cursor:pointer;
    font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:5px;
    font-family:var(--mono);transition:color .13s,background .13s}
  .codeblk .cbcopy:hover{color:var(--accent);background:var(--accent-dim)}
  .codeblk pre{margin:0;padding:13px 15px;overflow-x:auto;font:12.8px/1.65 var(--mono);
    color:#c8cdd6;white-space:pre}
  .tok-k{color:var(--accent)}
  .tok-s{color:var(--orange)}
  .tok-c{color:var(--faint);font-style:italic}
  .tok-n{color:var(--purple)}
  .tok-f{color:var(--blue)}
  .mdq{border-left:3px solid var(--accent);padding-left:11px;color:var(--muted);margin:6px 0}
  .icode{background:var(--panel2);border:1px solid var(--line);padding:1px 6px;border-radius:5px;
    font-size:.94em;color:var(--orange);font-family:var(--mono)}

  /* streaming phase + caret */
  .phase{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
  .phase .pdot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .phase.think .pdot{background:var(--purple);box-shadow:var(--purple-glow);animation:pp 1.2s ease-in-out infinite}
  .phase.write .pdot{background:var(--accent);box-shadow:var(--accent-glow);animation:pp 1.2s ease-in-out infinite}
  @keyframes pp{50%{opacity:.35}}
  .caret{display:inline-block;width:9px;height:16px;background:var(--accent);
    margin-left:3px;vertical-align:-3px;box-shadow:var(--accent-glow);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ============ LIVE TURN STATS ============ */
  .tstats{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:0 auto 14px;
    max-width:860px;padding:11px 15px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);font-family:var(--mono);font-size:11.5px;
    box-shadow:0 1px 0 rgba(255,255,255,.02) inset}
  .tstats .ts-live{display:flex;align-items:center;gap:7px;color:var(--accent);
    font-weight:800;font-size:10px;letter-spacing:1px;text-transform:uppercase;flex:none;text-shadow:var(--accent-glow)}
  .tstats .ts-live i{width:7px;height:7px;border-radius:50%;background:var(--accent);
    box-shadow:var(--accent-glow);animation:pp 3.2s ease-in-out infinite}
  .tstats .ts-cell{display:flex;flex-direction:column;gap:2px;min-width:0}
  .tstats .ts-cell .k{color:var(--faint);font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}
  .tstats .ts-cell .v{color:var(--bright);font-size:13.5px;font-weight:700;white-space:nowrap}
  .tstats .ts-cell .v .sub{color:var(--faint);font-weight:500;font-size:10.5px}
  .tstats .ts-cell .v.hi{color:var(--accent)}
  /* ============ FILE CARD (write/patch/edit) ============ */
  .fcard{background:var(--code);border:1px solid var(--line);border-left:3px solid var(--orange);
    border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:border-color .15s}
  .fcard:hover{border-color:var(--line2)}
  .fcard .fh{display:flex;align-items:center;gap:8px;padding:9px 13px;cursor:pointer;
    font:12px/1.4 var(--mono);user-select:none;list-style:none;transition:background .13s}
  .fcard .fh::-webkit-details-marker{display:none}
  .fcard .fh:hover{background:rgba(255,171,94,.05)}
  .fcard .fh .fpath{color:var(--orange);font-weight:600;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;flex:1;min-width:0}
  .fcard .fh .fstat{color:var(--faint);font-size:10.5px;white-space:nowrap;flex:none}
  .fcard .fh .car{color:var(--faint);transition:transform .15s;display:flex;flex:none}
  .fcard[open] .fh .car{transform:rotate(90deg)}
  .fcard .fbody{padding:2px 0 11px;font:11.8px/1.62 var(--mono);max-height:340px;overflow:auto;color:#c8cdd6}
  .fl{display:flex;white-space:pre}
  .fl .ln{color:#454553;width:40px;flex:none;text-align:right;padding-right:14px;user-select:none}
  .fl .lc{white-space:pre-wrap;word-break:break-word;flex:1}
  .fl.del{background:rgba(255,107,107,.09)}
  .fl.del .lc{color:var(--red)} .fl.del .ln{color:rgba(255,107,107,.5)}
  .fl.add{background:rgba(63,224,138,.08)}
  .fl.add .lc{color:var(--green)} .fl.add .ln{color:rgba(63,224,138,.5)}
  .tool .tstat{margin-left:auto;color:var(--faint);font:11px var(--mono);flex:none}
  .tool .tres{margin-top:7px;width:100%}
  .tool .tres summary{cursor:pointer;color:var(--faint);font:10.5px var(--mono);
    text-transform:uppercase;letter-spacing:.6px;list-style:none;display:inline-block;transition:color .13s}
  .tool .tres summary::-webkit-details-marker{display:none}
  .tool .tres summary:hover{color:var(--muted)}
  .tool .tresbody{margin:7px 0 2px;padding:9px 11px;background:var(--code);border:1px solid var(--line);
    border-radius:7px;font:11px/1.55 var(--mono);color:#c8cdd6;white-space:pre-wrap;word-break:break-word;
    max-height:220px;overflow:auto}

  .typing{display:inline-flex;gap:4px;align-items:center;padding:4px 2px}
  .typing i{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:tp 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes tp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .errbox{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);color:var(--red);
    border-radius:var(--radius);padding:10px 13px;font-size:13px;margin-bottom:12px;font-family:var(--mono)}
  .empty-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:var(--muted);padding:40px;text-align:center}
  .empty-main .big{width:56px;height:56px;border-radius:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent-hi));display:flex;align-items:center;
    justify-content:center;color:var(--accent-ink);font-size:26px;font-weight:800;margin-bottom:6px;
    box-shadow:var(--accent-glow)}
  .empty-main h2{color:var(--bright);font-size:22px;margin:0;font-weight:800;letter-spacing:.3px}

// Class-based error boundary: React 18 has no functional equivalent for
// catching render-phase throws, and an uncaught throw unmounts the whole
// root (black screen). Wrap <App/> so ANY render bug degrades to a recoverable
// message instead of wiping the UI.
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return {err:e};}
  render(){
    if(this.state.err){
      return <div className="errbox" style={{margin:"16px 16px 0"}}>
        <strong>Render error — caught (app did not go black):</strong><br/>
        <span style={{fontFamily:"var(--mono)",fontSize:12}}>{String(this.state.err&&this.state.err.message||this.state.err)}</span><br/>
        <div style={{marginTop:10,display:"flex",gap:8}}>
          <button className="btn ghost" style={{padding:"6px 12px",fontSize:12}} onClick={()=>this.setState({err:null})}>Retry render</button>
          <button className="btn" style={{padding:"6px 12px",fontSize:12}} onClick={()=>{try{localStorage.removeItem("hermes.efforts");localStorage.removeItem("hermes.locks");}catch(_){}this.setState({err:null});window.location.reload();}}>Reset UI state &amp; reload</button>
        </div>
      </div>;
    }
    return this.props.children;
  }
}

  // so a user's scroll-up is ALWAYS registered before the next follow decision — no race.
  // Scrolling up (past the threshold) stops auto-follow and shows the floating "Latest" button
  // (`!atBottom`); clicking it — or scrolling back to the bottom — resumes follow automatically.
  const [atBottom,setAtBottom]=useState(true);

  const scrollDown=useCallback(()=>{const el=scrollRef.current;if(el)el.scrollTop=el.scrollHeight;setFollowing(true);},[setFollowing]);

  // (1) Scroll listener = the INTENT detector. It fires ONLY on a real scroll event (a user
  //     swipe/scroll or our own programmatic scroll) — it does NOT fire from streaming content
  //     growth, because while following the view is already pinned at the bottom (no new scroll
  //     event). It reads the position: within 100px of the bottom => following, else => stopped.
  //     This is what lets a genuine scroll-up switch follow off (and drive the "Latest" button).
  // (2) rAF loop = the PINNER, running every frame while a turn streams. It re-pins the view to
  //     the bottom at 60fps while followingRef is true, so the newest token is always visible.

            else{setTools(ts=>{const n=[...ts];const i=n.findIndex(x=>x.name===p.tool_name&&!x.running);

              else n[i]={...n[i],running:true,args:p.args||null,preview:p.preview};
              return n;});
          }
          else if(ev==="tool.completed"||ev==="tool.failed"){
            const st=toolState.current[p.tool_name];
            if(st&&st.running){
              const dur=Math.max(0,(Date.now()-st.t0)/1000);
              st.running=false;st.err=ev==="tool.failed";
              toolMs.current+=dur*1000;
            }
            setTools(ts=>ts.map(t=>t.name===p.tool_name?{...t,running:false,dur:(st&&st.dur!=null)?st.dur:t.dur,err:ev==="tool.failed"}:t));
          }

            const n=Date.now(); if(!firstGen.current)firstGen.current=n; lastGen.current=n;

          }

            // input_tokens = full prompt the model processed this turn (system +
            //   history + message) — already context-cumulative, so use raw.
            // output_tokens = total the model generated this turn (thinking + tool
            //   calls + text) — per-turn, so use raw (NOT a diff).
            const promptTok=inTot;

            const toolMsTotal=Math.round(toolMs.current);
            const modelMs=Math.max(0,wallMs-toolMsTotal);
            // tok/s over the ACTIVE generation window only: first token emitted ->
            // last token, minus tool execution time inside it. Prefill (prompt
            // processing before the first token) is excluded.
            const genMs=Math.max(0,(lastGen.current-firstGen.current)-toolMsTotal);
            const toolCount=Object.keys(toolState.current).length;
            const modelMeta=(p.runtime&&p.runtime.model)||"";
            setStatsFinal({wallMs,toolMs:toolMsTotal/1000,modelMs,genMs,promptTok,genTok,
              spd:genMs>200?genTok/(genMs/1000):0,toolCount,model:modelMeta});
            if(p.messages){
              setMsgs(m=>{
                const clean=m.filter(x=>x.id!=='__stream');
                const mapped=p.messages.map((mm,ix)=>{
                  const rec={id:mm.id||('m'+ix),role:mm.role,text:mm.content||"",reasoning:mm.reasoning||mm.reasoning_content||"",tool:mm.tool_name};
                  if(mm.tool_name){
                    const st=toolState.current[mm.tool_name];
                    if(st){rec.args=st.args;if(st.dur!=null)rec.dur=st.dur;if(st.err)rec.err=true;}
                  }
                  return rec;
                });
                return [...clean,...mapped];
              });
            }else setMsgs(m=>[...m,{id:'a'+Date.now(),role:"assistant",text:p.content||streamText,reasoning}]);
            setStreamText("");setReasoning("");setTools([]);
            loadSessions().catch(()=>{});
            finished=true;
            try{reader.cancel().catch(()=>{});}catch(_){}
            break;
          }
          else if(ev==="error")setMsgs(m=>[...m,{id:'e'+Date.now(),role:"assistant",text:"",err:p.message}]);
        }
      }
      if(idleTimer)clearTimeout(idleTimer);
      if(streamText||reasoning)setMsgs(m=>[...m,{id:'a'+Date.now(),role:"assistant",text:streamText,reasoning}]);
    }catch(e){
      if(e.name!=="AbortError")setMsgs(m=>[...m,{id:'e'+Date.now(),role:"assistant",text:"",err:e.message}]);
    }finally{setStreaming(false);abortRef.current=null;}
  },[draft,streaming,cur,curEffort,stopSpeak,loadSessions,applyPendingModel]);

  const setEffortV=useCallback((e)=>{
    // Never deref cur.id inside the state updater (runs at render time →
    // a null cur there threw and blacked out the whole app). Resolve the key
    // now, in the click handler; if no session is open yet, persist under a
    // stable default key that the first message will inherit.
    const key=cur?cur.id:"__default__";
    setEffort(prev=>{const ne={...prev,[key]:e};lsSet("hermes.efforts",ne);return ne;});
  },[cur]);

  useEffect(()=>{
    const t=taRef.current;
    if(t){t.style.height="auto";t.style.height=Math.min(t.scrollHeight,170)+"px";}
  },[draft]);
  const onKey=useCallback((e)=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doSend();}},[doSend]);

  const q=query.trim().toLowerCase();
  const filtered=sessions.filter(s=>!q||(s.title||"").toLowerCase().includes(q)||(s.model||"").toLowerCase().includes(q)||(s.source||"").toLowerCase().includes(q));
  const groups={};
  for(const s of filtered){
    const g=SRC_LABEL[s.source]||"Other";
    (groups[g]=groups[g]||{order:SRC_ORDER[s.source]??9,items:[]}).items.push(s);
  }
  const groupNames=Object.keys(groups).sort((a,b)=>groups[a].order-groups[b].order);

  const liveMsg=streaming?{id:"__stream",role:"assistant",text:streamText,reasoning,tools,streaming:true}:null;
  return (
  <div className="app">
    <style>{`
      .bubble p{margin:0 0 9px}.bubble p:last-child{margin:0}
      .bubble ul,.bubble ol{margin:4px 0 9px;padding-left:20px}
      .bubble li{margin:2px 0}
      .mdh{font-weight:700;color:var(--bright);margin:8px 0 2px;font-size:14px}
      .bubble a{text-decoration:none;border-bottom:1px solid rgba(97,175,239,.4)}
      .tool .tp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:var(--faint);font-size:11.5px}
      .tool .tick{color:var(--green)}
    `}</style>
    <aside className={"side"+(sideOpen?" open":"")}>
      <div className="side-head">
        <div className="logo"><span className="mark">H</span>Hermes</div>
        <button className="newchat" onClick={newSession}><span dangerouslySetInnerHTML={{__html:I.plus(14)}}/>New</button>
      </div>
      <div className="searchwrap">
        <span dangerouslySetInnerHTML={{__html:I.search(14)}}/>
        <input className="search" placeholder="Search sessions…" value={query} onChange={e=>setQuery(e.target.value)}/>
      </div>
      <div className="side-list">
        {loading?[1,2,3,4,5].map(i=><div className="skeleton" key={i} style={i%2?{width:"72%"}:{width:"84%"}}/>):
        groupNames.length===0?<div style={{padding:"30px 12px",color:"var(--faint)",fontSize:13,textAlign:"center"}}>{q?"No matches":"No sessions yet"}</div>:
        groupNames.map(g=>(
          <div key={g}>
            <div className="grp">{g}</div>
            {groups[g].items.map(s=>(
              <div key={s.id} className={"item"+(cur&&cur.id===s.id?" on":"")} onClick={e=>openSession(s,e)}>
                <div className="body">
                  <div className="trow">
                    <div className="name">{s.title||s.id}</div>
                    <div className="ago">{timeAgo(s.last_active||s.started_at)}</div>
                  </div>
                  {s.preview&&<div className="prev">{s.preview}</div>}
                  <div className="meta">
                    <span className="pill">{s.model||"default"}</span>
                    {typeof s.message_count==="number"&&<span className="pill">{s.message_count}</span>}
                  </div>
                </div>
                <button className="del" title="Delete" onClick={e=>delSession(e,s)} title="Delete session" aria-label="Delete session" dangerouslySetInnerHTML={{__html:I.trash(14)}}></button>
              </div>
            ))}
          </div>
        ))}
      </div>
      <div className="side-foot">
        <div className="pulse"></div>
        <div style={{minWidth:0}}>
          <div className="m">{shownModel?shownModel.model:"…"}</div>
          <div className="p">{shownModel?shownModel.name+(shownModel.isDefault?" · default":""):"connecting"}</div>
        </div>
      </div>
    </aside>
    {sideOpen&&<div className="backdrop show" onClick={()=>setSideOpen(false)}/>}
    <div className="main">
      <div className="bar">
        <button className="iconbtn" onClick={()=>setSideOpen(true)} title="Menu" aria-label="Menu" dangerouslySetInnerHTML={{__html:I.menu(19)}}></button>
        <div className="title">{cur?(cur.title||"New chat"):"Hermes"}</div>
        {shownModel?(
          <div className={"modelpill"+((curLock||(!cur&&pendingModel))?" locked":"")} onClick={()=>setModelModal(true)} title="Change model">
            <div className="mdot"></div>
            <span>{curLock?curLock.model:shownModel.model}</span>
            <span className="mp">{shownModel.name}</span>
            <span dangerouslySetInnerHTML={{__html:I.chev(13)}}/>
          </div>
        ):null}
        {cur?<button className="btn icon ghost" title="Reload" aria-label="Reload" onClick={()=>openSession(cur)} dangerouslySetInnerHTML={{__html:I.refresh(16)}}/>:null}
      </div>
      <div className="chat" ref={scrollRef}>
        <div className="chat-inner">
          <StatsBar streaming={streaming} st={statsFinal} reasonLen={reasoning.length} textLen={streamText.length}
            toolMs={toolMs.current/1000} turnStart={turnStart.current} firstGen={firstGen.current} tools={tools} nowTick={nowTick} shownModel={shownModel}/>
          {!cur?(
            <div className="empty-main">
              <div className="big">H</div>
              <h2>Hermes</h2>
              <p>Pick a chat on the left or start a new one.</p>
            </div>
          ):loadingMsgs?(
            <div className="spinbig"></div>
          ):(
            <React.Fragment>
              {msgs.length===0&&!streaming&&(
                <div className="empty-main" style={{minHeight:240}}>
                  <h2>Hermes</h2>
                  <p>Ask anything. Full tools, memory, and your B70 model.</p>
                </div>
              )}
              {msgs.map((m,i)=>(
                <React.Fragment key={i}>
                  {m.err&&<div className="msg assistant"><div className="errbox">{m.err}</div></div>}
                  {m.role==="user"&&<MsgBubble msg={{...m,kind:"user"}} onSpeak={speak} speaking={speaking} doCopy={doCopy}/>}
                  {m.role!=="user"&&(m.text||m.reasoning||m.tool||(m.tools&&m.tools.length))&&
                    <MsgBubble msg={m} onSpeak={speak} speaking={speaking} doCopy={doCopy}/>}
                </React.Fragment>
              ))}
              {liveMsg&&<MsgBubble msg={liveMsg} onSpeak={speak} speaking={speaking} doCopy={doCopy}/>}
              <div style={{height:8}}/>
            </React.Fragment>
          )}
        </div>
      </div>
      <div className="composer">
        <div className="composer-inner">
          <div className="thinkrow">
            <span className="label">thinking</span>
            <div className="seg">
              {["off","low","medium","high","xhigh"].map(t=>(
                <button key={t} className={curEffort===t?"on":""} onClick={()=>setEffortV(t)}>{t==="xhigh"?"x high":t}</button>
              ))}
            </div>
          </div>
          <div className="cbox">
            <span className="cprompt">❯</span>
            <textarea ref={taRef} rows={1} placeholder={cur?"Message Hermes…":"Start a new chat — your first message creates the session"}
              value={draft} onChange={e=>setDraft(e.target.value)} onKey={onKey} disabled={streaming}/>
            <button className={"send"+(streaming?" stop":"")}
              onClick={streaming?(()=>{if(abortRef.current)abortRef.current.abort();else{setStreaming(false);setStreamText("");setReasoning("");setTools([]);}}):doSend}
              disabled={streaming?false:!draft.trim()} title={streaming?"Stop":"Send"}
              dangerouslySetInnerHTML={{__html:streaming?I.stop(16):I.send(17)}}/>
          </div>
        </div>
      </div>
      {cur&&!atBottom?(
        <button className="jump" onClick={scrollDown} title="Jump to latest" aria-label="Jump to latest">
          <span dangerouslySetInnerHTML={{__html:I.chev(15)}}/><span>Latest</span>
        </button>
      ):null}
    </div>
    {modelModal?(
      <ModelModal items={modelList.items}
        curKey={curLock?curLock.model+"|"+curLock.provider:((!cur&&pendingModel)?pendingModel.model+"|"+pendingModel.provider:(shownModel&&shownModel.isDefault?shownModel.model+"|"+modelList.def.provider:null))}
        onPick={i=>{if(cur){applyModel(i).then(()=>{setModelModal(false);showToast("Model: "+i.model);}).catch(e=>showToast(e.message));}else{setPendingModel(i);setModelModal(false);showToast("Model: "+i.model+" · applies to your next session");}}}
        onClose={()=>setModelModal(false)}/>
    ):null}
    {toast?<div className="toast">{toast}</div>:null}
  </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
